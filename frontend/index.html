<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>PhishEye</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            padding:40px;

            background:
            radial-gradient(circle at top,
            #7c3aed 0%,
            #22003d 40%,
            #050816 100%);

            color:white;
        }

        .container{

            width:700px;

            background: rgba(255,255,255,0.08);

            border:1px solid rgba(255,255,255,0.1);

            backdrop-filter: blur(20px);

            padding:50px;

            border-radius:30px;

            box-shadow:
            0 0 50px rgba(140,82,255,0.35);
        }

        h1{

            text-align:center;

            font-size:70px;

            margin-bottom:10px;

            background:
            linear-gradient(to right,
            #c084fc,
            #ffffff);

            -webkit-background-clip:text;

            -webkit-text-fill-color:transparent;
        }

        .subtitle{

            text-align:center;

            color:#d8c7ff;

            margin-bottom:40px;

            font-size:18px;

            line-height:1.5;
        }

        input{

            width:100%;

            padding:20px;

            border:none;

            border-radius:18px;

            margin-bottom:20px;

            font-size:16px;

            background:#ffffff;

            color:#111;
        }

        input:focus{

            outline:none;

            box-shadow:
            0 0 20px rgba(192,132,252,0.5);
        }

        button{

            width:100%;

            padding:20px;

            border:none;

            border-radius:18px;

            font-size:20px;

            font-weight:bold;

            cursor:pointer;

            background:
            linear-gradient(to right,
            #8b5cf6,
            #ec4899);

            color:white;

            transition:0.3s;
        }

        button:hover{

            transform:scale(1.02);

            box-shadow:
            0 0 30px rgba(192,132,252,0.5);
        }

        .result{

            margin-top:35px;

            background: rgba(255,255,255,0.08);

            padding:35px;

            border-radius:25px;

            border:1px solid rgba(255,255,255,0.08);
        }

        .risk-score{

            font-size:52px;

            font-weight:bold;

            margin-bottom:15px;
        }

        .risk-level{

            font-size:28px;

            margin-bottom:25px;

            color:#f3e8ff;
        }

        .section-title{

            margin-top:25px;

            margin-bottom:12px;

            color:#d8b4fe;

            font-size:22px;

            font-weight:bold;
        }

        #checkedUrl{

            word-wrap: break-word;

            overflow-wrap: break-word;

            word-break: break-word;

            line-height:1.8;

            color:#f5ecff;

            margin-top:10px;
        }

        ul{

            padding-left:25px;

            margin-top:15px;
        }

        li{

            margin-bottom:12px;

            color:#f3e8ff;

            line-height:1.6;
        }

        .footer{

            margin-top:35px;

            text-align:center;

            color:#c4b5fd;

            font-size:14px;

            line-height:1.6;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>PhishEye</h1>

    <p class="subtitle">
        Advanced AI-powered phishing and suspicious URL detection system.<br>
        
    </p>

    <input
            type="text"
            id="urlInput"
            placeholder="Paste a suspicious URL here..."
    >

    <button onclick="analyzeURL()">
        Analyze URL
    </button>

    <div class="result" id="result" style="display:none;">

        <div class="risk-score" id="riskScore"></div>

        <div class="risk-level" id="riskLevel"></div>

        <div class="section-title">
            Analyzed URL
        </div>

        <p id="checkedUrl"></p>

        <div class="section-title">
            Detection Reasons
        </div>

        <ul id="reasonsList"></ul>

    </div>

    <div class="footer">
        PhishEye © 2026 • AI-powered phishing detection platform
    </div>

</div>

<script>

    async function analyzeURL(){

        const url = document.getElementById("urlInput").value;

        const response = await fetch(
            `http://localhost:8080/analyze?url=${encodeURIComponent(url)}`
        );

        const data = await response.json();

        document.getElementById("result").style.display = "block";

        document.getElementById("riskScore").innerText =
            `Risk Score: ${data.riskScore}`;

        document.getElementById("riskLevel").innerText =
            `Risk Level: ${data.riskLevel}`;

        document.getElementById("checkedUrl").innerText =
            data.url;

        const reasonsList =
            document.getElementById("reasonsList");

        reasonsList.innerHTML = "";

        data.reasons.forEach(reason => {

            const li =
                document.createElement("li");

            li.innerText = reason;

            reasonsList.appendChild(li);

        });

    }

</script>

</body>
</html>
